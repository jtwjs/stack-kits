# 로컬 개발용. `./gradlew bootRun` 이 spring-boot-docker-compose 로 자동 기동하고 접속 정보를 주입한다.
# 값은 로컬 전용이다 — 운영 접속 정보는 환경변수(SPRING_DATASOURCE_*)로만.
services:
  mysql:
    image: "mysql:8.4"
    environment:
      - "MYSQL_DATABASE=app"
      - "MYSQL_USER=app"
      - "MYSQL_PASSWORD=app"
      - "MYSQL_ROOT_PASSWORD=root"
    ports:
      - "3306"

# kit 마다 스스로 초록이어야 한다. 브랜치 보호의 필수 체크는 ci-gate 하나.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kotlin-spring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: format
        run: ./gradlew ktlintCheck
      - name: test # Testcontainers(MySQL) · 계약 스냅샷(contracts/openapi.json) 포함
        run: ./gradlew test
      - name: build
        run: ./gradlew build -x test

  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { package_json_file: nextjs/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version-file: nextjs/.nvmrc
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: format
        run: pnpm format:check
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  nextjs-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { package_json_file: nextjs/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version-file: nextjs/.nvmrc
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e
        run: pnpm test:e2e

  ci-gate:
    if: always()
    needs: [kotlin-spring, nextjs, nextjs-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 모든 kit 잡이 성공해야 통과 (skipped·cancelled 도 실패로 친다)
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'

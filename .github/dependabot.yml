version: 2
# kit은 복사되는 틀이라 버전이 중요한 건 태그 찍을 때뿐이다 — 월 1회 · 폴더당 minor·patch 한 PR. 메이저는 태그 찍기 전에 사람이 올린다
# develop 브랜치 전략이면 각 항목에 target-branch: develop 을 넣는다 (기본은 레포 기본 브랜치)
updates:
  - package-ecosystem: gradle
    directory: /kotlin-spring
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /nextjs
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: gradle
    directory: /fullstack/apps/api
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /fullstack/apps/web
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /react-vite
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
